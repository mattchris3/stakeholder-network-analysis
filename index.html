<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Organization Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>
<body>
    <div class="welcome-container">
        <header class="welcome-header">
            <i class="fas fa-network-wired"></i>
            <h1>Organization Network Platform</h1>
        </header>

        <div class="options-grid">
            <div class="option-card blue" onclick="location.href='welcome-existing.html'">
                <div class="card-icon">
                    <i class="fas fa-users"></i>
                </div>
                <h2>Join Existing Unity</h2>
                <p>Already invited to a unity? Enter your access code and register your organization.</p>
                <div class="card-number">01</div>
            </div>

            <div class="option-card green" onclick="location.href='welcome-create.html'">
                <div class="card-icon">
                    <i class="fas fa-plus-circle"></i>
                </div>
                <h2>Create New Unity</h2>
                <p>Start your own collaborative network.</p>
                <div class="card-number">02</div>
            </div>

            <div class="option-card purple" onclick="location.href='welcome-admin.html'">
                <div class="card-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>Admin Access</h2>
                <p>Manage your unity</p>
                <div class="card-number">03</div>
            </div>
        </div>
    </div>
</body>
</html>
