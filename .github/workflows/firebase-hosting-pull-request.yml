# Checks every pull request and publishes a temporary preview of it.
# The preview link is posted as a comment on the pull request and expires after 7 days.
name: Test and preview pull request

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test_build_preview:
    # Pull requests from forks can't use the deploy secret, so they get tests only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build

      - if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEST_DATA_747C4 }}
          projectId: test-data-747c4
          expires: 7d
