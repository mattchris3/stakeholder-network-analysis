<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Unity - Organization Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>
<body>
    <div class="container" style="max-width:900px;">
        <header class="page-header">
            <i class="fas fa-network-wired"></i>
            <h1>Join Unity</h1>
            <p class="subtitle">Select Your Member Type</p>
        </header>

        <div class="options-container">
            <div class="type-card existing" onclick="location.href='welcome-existing-login.html'">
                <div class="card-icon">
                    <i class="fas fa-user-check"></i>
                </div>
                <h2>Existing Member</h2>
                <p>Already registered? Login with your credentials.</p>
                <div class="arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>

            <div class="type-card new" onclick="location.href='welcome-existing-new.html'">
                <div class="card-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>New Member</h2>
                <p>First time joining? Register your organization.</p>
                <div class="arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>
        </div>

        <footer class="page-footer">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </footer>
    </div>
</body>
</html>
