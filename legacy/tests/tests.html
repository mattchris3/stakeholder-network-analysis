<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity — Firebase Isolation Tests</title>
    <style>
        body {
            font-family: Calibri, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0a1628;
            color: #e0e0e0;
        }
        h1 {
            color: #ffffff;
            border-bottom: 2px solid #1a3a5c;
            padding-bottom: 10px;
        }
        #summary {
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .pass {
            color: #4CAF50;
            padding: 6px 0;
            border-bottom: 1px solid #162544;
        }
        .fail {
            color: #f44336;
            padding: 6px 0;
            border-bottom: 1px solid #162544;
            font-weight: bold;
        }
        #summary.pass {
            background: #1b3a20;
            color: #4CAF50;
        }
        #summary.fail {
            background: #3a1b1b;
            color: #f44336;
        }
    </style>
</head>
<body>
    <h1>Unity — Firebase Isolation Tests</h1>
    <div id="summary">Running...</div>
    <div id="results"></div>
    <script type="module" src="tests.js"></script>
</body>
</html>
